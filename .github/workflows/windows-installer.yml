name: Windows Setup EXE
on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test extension
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
      - name: Ensure NSIS compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress --limit-output
          }
      - name: Compile setup EXE
        shell: pwsh
        run: |
          $nsis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS not found' }
          & $nsis "/DREPO_ROOT=$env:GITHUB_WORKSPACE" "/DOUTPUT_FILE=$env:GITHUB_WORKSPACE\ChatVault-Setup-v0.1.3.exe" 'installer\ChatVault.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed: $LASTEXITCODE" }
          if (-not (Test-Path 'ChatVault-Setup-v0.1.3.exe')) { throw 'Installer not generated' }
          $file = Get-Item 'ChatVault-Setup-v0.1.3.exe'
          if ($file.Length -lt 10000) { throw 'Installer suspiciously small' }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Path 'ChatVault-Setup-v0.1.3.exe.sha256' -Encoding ascii
          Write-Host "Installer: $($file.Length) bytes, sha256 $hash"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatVault-Windows-Setup-v0.1.3
          path: |
            ChatVault-Setup-v0.1.3.exe
            ChatVault-Setup-v0.1.3.exe.sha256
      - name: Attach to GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exists = $false
          for ($attempt=1; $attempt -le 25; $attempt++) {
            gh release view v0.1.3 *> $null
            if ($LASTEXITCODE -eq 0) { $exists = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $exists) { throw 'Release v0.1.3 did not appear' }
          gh release upload v0.1.3 'ChatVault-Setup-v0.1.3.exe' 'ChatVault-Setup-v0.1.3.exe.sha256' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload Windows installer' }